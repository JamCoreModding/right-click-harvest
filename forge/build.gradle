plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id 'me.modmuss50.mod-publish-plugin'
}

architectury {
    platformSetupLoomIde()
    forge()
}

base {
    archivesName = "rightclickharvest-forge"
}

loom {
    forge {
        mixinConfig "rightclickharvest.mixins.json"
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

repositories {
    maven {
        name = "Forge"
        url = "https://maven.minecraftforge.net"
    }
}

dependencies {
    forge libs.forge
    modImplementation libs.architectury.forge
    modImplementation libs.jamlib.forge

    forgeRuntimeLibrary "blue.endless:jankson:1.2.3"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
}

if (System.getenv("CURSEFORGE_API_KEY") != null && System.getenv("MODRINTH_API_KEY") != null) {
    publishMods {
         file = tasks.remapJar.archiveFile
         displayName = "V${project.version} (Forge ${project.minecraft_version})"
         changelog = rootProject.file("CHANGELOG.md").text
         type = project.version.contains("beta") ? BETA : STABLE
         modLoaders.add("forge")

         curseforge {
             projectId = "452834"
             accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
             client = true
             server = true
             minecraftVersions.add(project.minecraft_version)
             minecraftVersions.addAll(project.additional_minecraft_versions == "" ? [] : project.additional_minecraft_versions.split(","))
             requires("jamlib")
             requires("architectury-api")
         }

         modrinth {
             projectId = "Cnejf5xM"
             accessToken = providers.environmentVariable("MODRINTH_API_KEY")
             minecraftVersions.add(project.minecraft_version)
             minecraftVersions.addAll(project.additional_minecraft_versions == "" ? [] : project.additional_minecraft_versions.split(","))
             requires("jamlib")
             requires("architectury-api")
         }
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archivesBaseName + "-forge"
            from components.java
        }
    }

    repositories {
        if (System.getenv("MAVEN_USERNAME") != null && System.getenv("MAVEN_PASSWORD") != null) {
            maven {
                url = "https://maven.jamalam.tech/releases"
                credentials {
                    username = System.getenv("MAVEN_USERNAME")
                    password = System.getenv("MAVEN_PASSWORD")
                }
            }
        }
    }
}

processResources {
    def substitutions = [
            "version"             : project.version,
            "minecraft_version"   : project.minimum_minecraft_version,
            "architectury_version": project.minimum_architectury_api_version,
            "jamlib_version"      : project.minimum_jamlib_version
    ]

    filesMatching("META-INF/mods.toml") {
        expand substitutions
    }

    substitutions.each { inputs.property it.key, it.value }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
